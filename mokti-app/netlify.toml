[build]
  publish = "."
  # Turns blog/posts/*.md into blog pages. Plain Node, no packages.
  command = "node scripts/build-blog.mjs"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# /services and /ai are small pages in services/ and ai/. These catch
# Instagram's encoded link and old Shopify-era paths.

[[redirects]]
  from = "/%23services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/blogs/*"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/collections/mokti-stories"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/#ebooks"
  status = 301

# The Writing section and Journal page were replaced by the blog.
[[redirects]]
  from = "/journal.html"
  to = "/blog/"
  status = 301
