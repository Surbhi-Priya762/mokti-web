[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# /services and /ai are small pages in services/ and ai/. These catch
# Instagram's encoded link and old Shopify-era paths.

[[redirects]]
  from = "/%23services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/blogs/*"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/collections/mokti-stories"
  to = "/#writing"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/#ebooks"
  status = 301
